<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tủ Sách — Book Reviews</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">
      <span class="ornament">✦</span> Tủ Sách <span class="ornament">✦</span>
    </h1>
    <p class="site-tagline">Những cuốn sách đã đi qua — và để lại dấu ấn</p>
    <div class="divider"></div>
  </header>

  <main class="container">
    <p class="section-heading">Thư viện review</p>

    <div class="book-grid">

      <!-- BOOK CARDS -->
      <!-- Các card sách sẽ được thêm vào đây bởi Claude khi review sách mới -->

      <div class="empty-state">
        <span class="empty-icon">📚</span>
        <p>
          Tủ sách đang chờ những trang đầu tiên.<br>
          Hãy yêu cầu Claude review một cuốn sách để bắt đầu.
        </p>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <p>✦ Tủ sách cá nhân ✦</p>
  </footer>

</body>
</html>
